  Ein neues deutschsprachiges Grundlagen-Set, das den psychologischen
  Grundstoff von Anfang an über Verständnis prüft statt über Jahreszahlen
  und Namen: Psychologie als empirische Wissenschaft, Konditionierung und
  Modelllernen, Gedächtnis und Emotion sowie eine Wiederholung mit
  benotetem Test. Nutzt die neu verfügbaren Aufgabentypen Leseverständnis,
  Kategorisierung, Fehlerkorrektur und benotetes Quiz.
