# Psychologie: Verständnis-Grundlagen (für Deutschsprachige), Set-Manifest.
#
# Neues, verständnisorientiertes Grundlagen-Set (domain: psychology).
# Material und Erklärung sind beide auf Deutsch (source_language ==
# target_language); der Set-Ordner trägt einen Themennamen
# (psych-grundlagen) statt eines {target}-{level}-Namens. Der
# Content-Loader liest metadata.lessons für die Dateiliste.
#
# Hintergrund (siehe Issue #21): Das grosse Set psych-intro prüft an
# einigen Stellen reine Fakten (Jahreszahl, Eigenname). Solche Aufgaben
# in einem veröffentlichten Set zu ersetzen ist mit der gepinnten Engine
# nicht tor-konform möglich, weil das Ausmustern veröffentlichter
# Kennungen gesperrt ist (E-RETIRED-IDS-LOCKED). Statt das alte Set
# umzubauen, entsteht hier ein neues Set, das denselben Grundstoff von
# Anfang an über Verständnis prüft und die neu verfügbaren Aufgabentypen
# nutzt.
#
# v0.1.0 (schema v1.4): Starter-Set mit vier Lektionen. Genutzte
# Aufgabentypen: die Erweiterungstypen ext:al-reading-comprehension,
# ext:al-categorization, ext:al-error-correction und ext:al-graded-quiz
# sowie die Kern-Typen multiple_choice, matching, cloze (type) und
# free_text, mit einem Theorie-Schritt pro Lektion. picture_choice wird
# bewusst weggelassen, da keine sinnvollen, real vorhandenen Bilder
# vorliegen. review_status: generated, denn der Inhalt ist
# maschinell entworfen und wartet auf eine fachliche Durchsicht.
schema_version: '1.4'
name: 'Psychologie: Verständnis-Grundlagen'
